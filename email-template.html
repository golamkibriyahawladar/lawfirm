<!-- Subject: Consultation Confirmed: {{matter}} - {{law_firm_name}} -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width">
</head>
<body style="margin:0;padding:20px;background:#0a0f1d;font-family:'Segoe UI',Arial,sans-serif;color:#f8fafc;">
  <table width="100%" border="0" cellspacing="0" cellpadding="0" style="max-width:520px;margin:0 auto;background:#121a2d;border:1px solid #c5a059;border-radius:10px;padding:28px;">
    <tr>
      <td>
        <h3 style="color:#c5a059;margin:0 0 16px;font-size:20px;">Consultation Confirmed ✅</h3>
        <p style="margin:0 0 12px;color:#f8fafc;font-size:15px;">Hi {{client_name}},</p>
        <p style="margin:0 0 16px;color:#94a3b8;font-size:14px;line-height:1.5;">Your consultation with our attorney has been scheduled.</p>
        <div style="background:#0a0f1d;border-left:3px solid #c5a059;padding:12px 16px;margin-bottom:16px;border-radius:4px;font-size:14px;">
          <p style="margin:0 0 6px;"><b>Matter:</b> {{matter}}</p>
          <p style="margin:0;"><b>Time:</b> {{consultation_time}}</p>
        </div>
        <p style="margin:0 0 20px;color:#94a3b8;font-size:14px;">We've also sent your intake information to the firm.</p>
        <p style="margin:0;color:#f8fafc;font-size:14px;border-top:1px solid rgba(255,255,255,0.08);padding-top:16px;">Thank you,<br><strong style="color:#c5a059;">{{law_firm_name}}</strong></p>
      </td>
    </tr>
  </table>
</body>
</html>
